<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasszikus IAT Teszt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }

    #iat-container {
      width: 800px;
      min-height: 520px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .labels-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 20px;
      font-weight: bold;
    }

    .left-label {
      color: #2b5c8f;
      text-align: left;
    }

    .right-label {
      color: #2b5c8f;
      text-align: right;
    }

    #stimulus-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 250px;
      width: 100%;
      position: relative;
    }

    #stimulus-img {
      max-height: 220px;
      max-width: 320px;
      display: none;
    }

    #error-mark {
      color: red;
      font-size: 60px;
      font-weight: bold;
      position: absolute;
      bottom: 10px;
      display: none;
    }

    .instructions {
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      max-width: 700px;
    }

    .footer-hints {
      font-size: 14px;
      color: #666;
    }

    /* Táblázat stílus az eredményekhez */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 14px;
    }

    .results-table th, .results-table td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: center;
    }

    .results-table th {
      background-color: #2b5c8f;
      color: white;
    }

    .results-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      background-color: #2b5c8f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d3d60;
    }

    button.download-btn {
      background-color: #28a745;
    }

    button.download-btn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>

<div id="iat-container">
  <div class="labels-container">
    <div id="left-label" class="left-label"></div>
    <div id="right-label" class="right-label"></div>
  </div>

  <div id="stimulus-container">
    <img id="stimulus-img" src="" alt="stimulus">
    <div id="instructions-text" class="instructions"></div>
    <div id="error-mark">X</div>
  </div>

  <div id="footer-hints" class="footer-hints"></div>
</div>

<script>
  function generateImages(prefix, count) {
    const list = [];
    for (let i = 1; i <= count; i++) {
      let filename = (prefix === 'A') ? `A_${i}.jpg` : `${prefix}${i}.jpg`;
      list.push(filename);
    }
    return list;
  }

  const items = {
    A: generateImages('A', 10),
    B: generateImages('B', 10),
    C: generateImages('C', 10),
    D: generateImages('D', 10)
  };

  const names = {
    A: "Kedvelt A",
    B: "Kedvelt B",
    C: "Nem kedvelt C",
    D: "Nem kedvelt D"
  };

  const blocks = [
    {
      name: "1. Blokk (Target)",
      title: "1. Blokk: Kedvelt kategóriák gyakorlása",
      instructions: `Helyezd a bal mutatóujjadat az <b>E</b>, a jobb mutatóujjadat az <b>I</b> billentyűre.<br><br>
                     Balra (<b>E</b>): ${names.A}<br>
                     Jobbra (<b>I</b>): ${names.B}<br><br>
                     A folytatáshoz nyomd meg a <b>SPACE</b> billentyűt!`,
      left: ['A'],
      right: ['B'],
      trials: 20
    },
    {
      name: "2. Blokk (Attribute)",
      title: "2. Blokk: Nem kedvelt kategóriák gyakorlása",
      instructions: `Most a nem kedvelt képek következnek.<br><br>
                     Balra (<b>E</b>): ${names.C}<br>
                     Jobbra (<b>I</b>): ${names.D}<br><br>
                     A folytatáshoz nyomd meg a <b>SPACE</b> billentyűt!`,
      left: ['C'],
      right: ['D'],
      trials: 20
    },
    {
      name: "3. Blokk (Kombinált 1)",
      title: "3. Blokk: Kombinált Teszt (1. Rész)",
      instructions: `A kategóriák összevonásra kerültek.<br><br>
                     Balra (<b>E</b>): ${names.A} VAGY ${names.C}<br>
                     Jobbra (<b>I</b>): ${names.B} VAGY ${names.D}<br><br>
                     A folytatáshoz nyomd meg a <b>SPACE</b> billentyűt!`,
      left: ['A', 'C'],
      right: ['B', 'D'],
      trials: 40
    },
    {
      name: "4. Blokk (Felcserélt Target)",
      title: "4. Blokk: Felcserélt kedvelt kategóriák",
      instructions: `Figyelem! A kedvelt kategóriák oldala felcserélődött.<br><br>
                     Balra (<b>E</b>): ${names.B}<br>
                     Jobbra (<b>I</b>): ${names.A}<br><br>
                     A folytatáshoz nyomd meg a <b>SPACE</b> billentyűt!`,
      left: ['B'],
      right: ['A'],
      trials: 20
    },
    {
      name: "5. Blokk (Kombinált 2)",
      title: "5. Blokk: Kombinált Teszt (2. Rész)",
      instructions: `Az új felállás szerinti kombinált teszt.<br><br>
                     Balra (<b>E</b>): ${names.B} VAGY ${names.C}<br>
                     Jobbra (<b>I</b>): ${names.A} VAGY ${names.D}<br><br>
                     A folytatáshoz nyomd meg a <b>SPACE</b> billentyűt!`,
      left: ['B', 'C'],
      right: ['A', 'D'],
      trials: 40
    }
  ];

  let currentBlockIndex = 0;
  let currentTrialIndex = 0;
  let trialSequence = [];
  let startTime = 0;
  let waitingForSpace = true;
  let trialHadError = false;

  // Teljes adatgyűjtés az összes próbáról
  let rawLog = [];

  const leftLabelEl = document.getElementById('left-label');
  const rightLabelEl = document.getElementById('right-label');
  const instructionsEl = document.getElementById('instructions-text');
  const stimulusImgEl = document.getElementById('stimulus-img');
  const errorMarkEl = document.getElementById('error-mark');
  const footerHintsEl = document.getElementById('footer-hints');

  function showBlockInstructions() {
    waitingForSpace = true;
    stimulusImgEl.style.display = 'none';
    errorMarkEl.style.display = 'none';
    
    const b = blocks[currentBlockIndex];
    leftLabelEl.innerHTML = b.left.map(k => names[k]).join("<br>vagy<br>");
    rightLabelEl.innerHTML = b.right.map(k => names[k]).join("<br>vagy<br>");
    
    instructionsEl.innerHTML = `<h3>${b.title}</h3><p>${b.instructions}</p>`;
    instructionsEl.style.display = 'block';
    footerHintsEl.innerHTML = "Nyomj SPACE-t az indításhoz!";
  }

  function generateTrialSequence(block) {
    let seq = [];
    let pool = [];
    
    block.left.concat(block.right).forEach(cat => {
      items[cat].forEach(img => {
        pool.push({ img: img, category: cat });
      });
    });

    for (let i = 0; i < block.trials; i++) {
      let randItem = pool[Math.floor(Math.random() * pool.length)];
      seq.push(randItem);
    }
    return seq;
  }

  function startBlock() {
    waitingForSpace = false;
    instructionsEl.style.display = 'none';
    stimulusImgEl.style.display = 'block';
    footerHintsEl.innerHTML = "<b>E</b> = Bal oldal | <b>I</b> = Jobb oldal";
    
    trialSequence = generateTrialSequence(blocks[currentBlockIndex]);
    currentTrialIndex = 0;
    nextTrial();
  }

  function nextTrial() {
    errorMarkEl.style.display = 'none';
    trialHadError = false;

    if (currentTrialIndex >= trialSequence.length) {
      currentBlockIndex++;
      if (currentBlockIndex < blocks.length) {
        showBlockInstructions();
      } else {
        showResults();
      }
      return;
    }

    const currentTrial = trialSequence[currentTrialIndex];
    stimulusImgEl.src = currentTrial.img;
    startTime = performance.now();
  }

  function handleKeyPress(e) {
    const key = e.key.toLowerCase();

    if (waitingForSpace) {
      if (e.code === 'Space') {
        startBlock();
      }
      return;
    }

    if (key !== 'e' && key !== 'i') return;

    const reactionTime = Math.round(performance.now() - startTime);
    const currentTrial = trialSequence[currentTrialIndex];
    const currentBlock = blocks[currentBlockIndex];

    let correctHand = '';
    if (currentBlock.left.includes(currentTrial.category)) {
      correctHand = 'e';
    } else if (currentBlock.right.includes(currentTrial.category)) {
      correctHand = 'i';
    }

    const isCorrect = (key === correctHand);

    // Mentsük el a nyers adatot
    rawLog.push({
      blockIndex: currentBlockIndex + 1,
      blockName: currentBlock.name,
      trialNum: currentTrialIndex + 1,
      image: currentTrial.img,
      category: currentTrial.category,
      keyPressed: key,
      correctKey: correctHand,
      isCorrect: isCorrect,
      hadErrorBefore: trialHadError,
      reactionTime: reactionTime
    });

    if (isCorrect) {
      currentTrialIndex++;
      nextTrial();
    } else {
      trialHadError = true;
      errorMarkEl.style.display = 'block';
    }
  }

  function calculateStats() {
    const blockStats = blocks.map((b, idx) => {
      // Csak az adott blokk próbáit nézzük (az első gombnyomás reakcióidejét)
      const blockTrials = rawLog.filter(l => l.blockIndex === idx + 1);
      
      // Első próbálkozások kiszűrése (a hibás válaszok előtti reakcióidő is számít)
      const validTimes = blockTrials.map(t => t.reactionTime);
      const errors = blockTrials.filter(t => !t.isCorrect).length;
      
      const sum = validTimes.reduce((a, b) => a + b, 0);
      const avg = validTimes.length > 0 ? Math.round(sum / validTimes.length) : 0;

      return {
        name: b.name,
        trials: blockTrials.length,
        avgTime: avg,
        errors: errors
      };
    });

    // D-score számítás (3. és 5. blokk alapján)
    const b3Log = rawLog.filter(l => l.blockIndex === 3 && l.reactionTime <= 10000);
    const b5Log = rawLog.filter(l => l.blockIndex === 5 && l.reactionTime <= 10000);

    const avgB3 = b3Log.reduce((a, b) => a + b.reactionTime, 0) / (b3Log.length || 1);
    const avgB5 = b5Log.reduce((a, b) => a + b.reactionTime, 0) / (b5Log.length || 1);

    const combinedTimes = b3Log.concat(b5Log).map(l => l.reactionTime);
    const meanAll = combinedTimes.reduce((a, b) => a + b, 0) / (combinedTimes.length || 1);
    const variance = combinedTimes.reduce((a, b) => a + Math.pow(b - meanAll, 2), 0) / (combinedTimes.length || 1);
    const sd = Math.sqrt(variance) || 1;

    const dScore = ((avgB5 - avgB3) / sd).toFixed(2);

    return { blockStats, dScore, avgB3: Math.round(avgB3), avgB5: Math.round(avgB5) };
  }

  function downloadCSV() {
    let csv = "Blokk_Szam;Blokk_Nev;Proba_Szam;Kep;Kategoria;Lenyomott_Gomb;Helyes_Gomb;Helyes_Volt;Reakcioido_ms\n";
    rawLog.forEach(row => {
      csv += `${row.blockIndex};"${row.blockName}";${row.trialNum};"${row.image}";"${row.category}";"${row.keyPressed}";"${row.correctKey}";${row.isCorrect};${row.reactionTime}\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", "iat_eredmenyek.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function showResults() {
    stimulusImgEl.style.display = 'none';
    errorMarkEl.style.display = 'none';
    leftLabelEl.innerHTML = '';
    rightLabelEl.innerHTML = '';
    footerHintsEl.innerHTML = '';

    const stats = calculateStats();

    let tableRows = stats.blockStats.map(s => `
      <tr>
        <td style="text-align: left;">${s.name}</td>
        <td>${s.avgTime} ms</td>
        <td>${s.errors} db</td>
      </tr>
    `).join('');

    instructionsEl.innerHTML = `
      <h2>A teszt véget ért!</h2>
      <p><b>Kiszámított D-érték:</b> ${stats.dScore}</p>
      
      <table class="results-table">
        <thead>
          <tr>
            <th>Blokk</th>
            <th>Átlagos reakcióidő</th>
            <th>Melléütések (hibák)</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>

      <div class="btn-container">
        <button class="download-btn" onclick="downloadCSV()">Részletes adatok letöltése (CSV)</button>
        <button onclick="location.reload()">Teszt újrakezdése</button>
      </div>
    `;
    instructionsEl.style.display = 'block';
  }

  document.addEventListener('keydown', handleKeyPress);
  showBlockInstructions();
</script>

</body>
</html>
